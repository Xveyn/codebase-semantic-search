name: Bug Report
description: Report a problem with the MCP server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run search_code with ..., it returns ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Initialize index for project X
        2. Run search_code "..."
        3. See error
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Embedding provider
      options:
        - Ollama
        - transformers.js (fallback)
        - OpenAI
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version (`node -v`), and package version.
      placeholder: |
        OS: Windows 11
        Node: v20.11.0
        Version: 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any stderr output (logging goes to stderr).
      render: shell
    validations:
      required: false
